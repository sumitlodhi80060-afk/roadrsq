name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create base project
        run: flutter create --org com.roadresq --project-name roadresq app

      - name: Copy our code
        run: |
          cp pubspec.yaml app/pubspec.yaml
          cp main.dart app/lib/main.dart

      - name: Patch AndroidManifest
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/><uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/><uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/><application#' app/android/app/src/main/AndroidManifest.xml
          sed -i 's#<queries>#<queries><intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>#' app/android/app/src/main/AndroidManifest.xml

      - name: Set minSdk
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/' app/android/app/build.gradle.kts || true
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' app/android/app/build.gradle || true

      - name: Build APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: roadresq-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
